[package]
name = "clyx"
version = "0.1.0"
edition = "2024"
description = "A modern Rust-powered CLI to easily create, configure, and build C/C++ projects with CMake."
license = "MIT"
repository = "https://github.com/Viazel/Clyx"
readme = "README.md"
keywords = ["cli", "tool", "cinit", "c", "cpp"]
categories = ["command-line-utilities"]

[[bin]]
name = "Clyx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "2"
dialoguer = "0.11"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
